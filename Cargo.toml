[workspace]
resolver = "2"
members = ["crates/gnss-core", "crates/gnss-iq", "crates/gnss-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gnss-core = { path = "crates/gnss-core" }
gnss-iq = { path = "crates/gnss-iq" }

# Small code size matters: this workspace ships to the browser as wasm.
#
# NOTE: `panic = "abort"` is deliberately NOT set. `gnss-core::parse_nav`
# contains a third-party parser that panics on some malformed RINEX, and
# containing it with `catch_unwind` requires unwinding to be available.
# Aborting would trap and poison the WASM module instead of surfacing an
# error, so the few kB of unwind tables are worth it.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
