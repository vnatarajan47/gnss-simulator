[package]
name = "gnss-iq"
description = "GNSS baseband IQ synthesis: observables, signal generation and job execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "gnss_iq"
path = "src/lib.rs"

[[bin]]
name = "gnss-iq-worker"
path = "src/bin/worker.rs"

[dependencies]
# NOTE: unlike `gnss-wasm`, this crate is native-only. It writes files whose
# size is measured in hundreds of megabytes and runs for minutes; neither is
# something a browser tab can do. See docs/adr/0007-server-side-iq-worker.md.
gnss-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
